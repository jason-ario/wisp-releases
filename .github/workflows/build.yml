# Builds Wisp for Windows and Mac and publishes the release here, in this public repo, where GitHub Actions
# minutes are free. The app's source stays private: each run checks out jason-ario/InterfaceEverythingApp with
# the APP_REPO_TOKEN secret and builds it. Only the finished installers land here, as before.
#
# To release: bump "version" in the app's package.json and push it to main, then either
#   - put the branch, tag or commit to build in release.txt here and push it (Claude can do this for you), or
#   - Actions tab → Build and release Wisp → Run workflow.
# The release's tag comes from the app's package.json version (v0.9.22, etc.).
#
# Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   APP_REPO_TOKEN   required: a fine-grained GitHub token with "Contents: Read-only" on jason-ario/InterfaceEverythingApp
#   Mac signing, optional (copy them over from the app repo if you set them there; see its scripts/mac-signing.js):
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD, MAC_SIGN_IDENTITY, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# Runs only on a push to this repo or a manual run, never for pull requests, so the secrets aren't exposed.
name: Build and release Wisp

on:
  push:
    branches: [main]
    paths: [release.txt]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of InterfaceEverythingApp to build
        default: main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_REPO: jason-ario/InterfaceEverythingApp

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        shell: bash
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [ -z "$REF" ] && [ -f release.txt ]; then REF="$(head -n1 release.txt | tr -d '[:space:]')"; fi
          echo "ref=${REF:-main}" >> "$GITHUB_OUTPUT"
      - name: Check the app repo token is set
        shell: bash
        env:
          APP_REPO_TOKEN: ${{ secrets.APP_REPO_TOKEN }}
        run: |
          if [ -z "$APP_REPO_TOKEN" ]; then
            echo "::error::Add the APP_REPO_TOKEN secret (read access to $APP_REPO) in this repo's Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.APP_REPO_TOKEN }}
          path: app
      - id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A rerun, or the same version released again, reuses the release that's already there.
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "Wisp $TAG" --notes "" --target main

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.prepare.outputs.ref }}
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Skip install scripts: @met4citizen/headtts has one that fails on Windows, and nothing else needs them here.
      - run: npm ci --ignore-scripts
      - run: node scripts/fill-cloud-config.js
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/Wisp-Setup.exe -R "$GITHUB_REPOSITORY" --clobber

  mac:
    needs: prepare
    # Intel runner: GitHub's Apple silicon pool keeps running out of capacity. build-mac-release.js packages
    # each chip separately, so the runner's chip doesn't matter.
    runs-on: macos-15-intel
    env:
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.prepare.outputs.ref }}
          token: ${{ secrets.APP_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Import the Developer ID certificate
        if: env.MAC_CERT_P12_BASE64 != ''
        shell: bash
        env:
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/wisp-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 16)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "WISP_MAC_SIGN_IDENTITY=${{ secrets.MAC_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/build-mac-helpers.js --strict
      - run: node scripts/fill-cloud-config.js
      - run: node scripts/build-mac-release.js
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/*.dmg dist/*.zip -R "$GITHUB_REPOSITORY" --clobber

  # Every download is on the draft: publish it and make it the latest, which is what the site and updater use.
  publish:
    needs: [prepare, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
